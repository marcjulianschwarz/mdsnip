services:
  backend:
    image: ${IMAGE_BASE:-ghcr.io/marcjulianschwarz/mdsnip}-backend:latest
    pull_policy: always
    ports:
      - "8030:3000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - FRONTEND_URL=${FRONTEND_URL}
      - NODE_ENV=${NODE_ENV}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}

  frontend:
    image: ${IMAGE_BASE:-ghcr.io/marcjulianschwarz/mdsnip}-frontend:latest
    pull_policy: always
    ports:
      - "8031:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV}

  db:
    image: postgres
    restart: always
    ports:
      - 8034:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
    external: true
    name: mdsnip_pgdata
